name: Uptime

# Backstop only. The uven-uptime Cloudflare Worker (see uptime-worker/) is the real
# monitor; this catches the case where the Worker itself is broken or undeployed.
#
# Do not tighten this cron. GitHub's scheduled runs are best-effort and throttled: set to
# */15, this delivered a median of one run every 3.6 hours, and not one interval under 20
# minutes across 99 samples. A two-hour outage on 2026-09-22 fell entirely between two
# checks. Hourly is closer to what actually gets delivered, so the file stops implying a
# guarantee nobody is keeping.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: API health (api.uven.se)
        run: |
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 \
              https://api.uven.se/actuator/health || echo 000)
            if [ "$code" = "200" ] && grep -q '"status":"UP"' /tmp/body; then
              echo "healthy (HTTP $code)"
              exit 0
            fi
            echo "attempt $attempt failed: HTTP $code — $(cat /tmp/body 2>/dev/null | head -c 300)"
            [ "$attempt" -lt 3 ] && sleep 30
          done
          echo "::error::api.uven.se did not report UP after 3 attempts over ~1 minute"
          exit 1

      - name: Public site (uven.se)
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://uven.se/ || echo 000)
          if [ "$code" != "200" ]; then
            echo "::error::uven.se returned HTTP $code"
            exit 1
          fi
          echo "uven.se OK (HTTP $code)"

      - name: Events endpoint returns data
        # A healthy JVM that can't reach the database still answers /actuator/health on some
        # failure modes; this proves the whole read path works end to end.
        run: |
          code=$(curl -sS -o /tmp/events -w '%{http_code}' --max-time 20 \
            'https://api.uven.se/api/v1/events?size=1' || echo 000)
          if [ "$code" != "200" ]; then
            echo "::error::/api/v1/events returned HTTP $code — $(head -c 300 /tmp/events)"
            exit 1
          fi
          echo "events endpoint OK (HTTP $code)"

      - name: Uptime-workern lever (dead man's switch)
        # The Worker watches UVEN; nothing watches the Worker. If it is undeployed, erroring on
        # every run, or its KV binding is gone, it goes quiet — and silence from a monitor looks
        # exactly like everything being fine. So we read the heartbeat it writes on each run and
        # fail when it goes stale. This job's own cadence is unreliable, which is acceptable
        # here: a broken monitor is far rarer than an outage, and "noticed within a few hours"
        # beats "never".
        env:
          WORKER_URL: ${{ vars.UPTIME_WORKER_URL }}
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "::warning::UPTIME_WORKER_URL är inte satt — hoppar över. Se uptime-worker/README.md"
            exit 0
          fi
          code=$(curl -sS -o /tmp/hb -w '%{http_code}' --max-time 20 "${WORKER_URL%/}/heartbeat" || echo 000)
          if [ "$code" != "200" ]; then
            echo "::error::Uptime-workern svarar inte på /heartbeat (HTTP $code) — övervakningen är nere"
            exit 1
          fi
          age=$(jq -r '.ageSeconds // "null"' /tmp/hb)
          if [ "$age" = "null" ]; then
            echo "::error::Uptime-workern har aldrig kört — den övervakar ingenting"
            exit 1
          fi
          # Cron is every 5 minutes; 20 allows four missed runs before we call it dead.
          if [ "$age" -gt 1200 ]; then
            echo "::error::Uptime-workern körde senast för $((age / 60)) minuter sedan — den har slutat mäta"
            exit 1
          fi
          echo "uptime-workern lever (senaste körning ${age}s sedan: $(jq -r '.lastResult' /tmp/hb))"
