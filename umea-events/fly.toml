# Fly.io deploy config for the UVEN backend. Run `fly deploy` from this directory.
# Only used if you choose Fly.io as the backend host. Region arn = Stockholm.
app = "uven-api"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep the machine always on — no cold starts / 503s on the first request after idle.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "30s"
  method = "GET"
  path = "/actuator/health"

[[vm]]
  size = "shared-cpu-1x"
  # 1GB, not 512MB: the JVM was OOM-killed twice on 512 and then spent 20+ minutes in a GC
  # spiral serving nothing. The heap takes half the machine, and thread stacks, metaspace and
  # Jsoup buffers have to fit in the other half. Keep this here rather than using
  # `fly scale memory` — a deploy reads this file and would silently scale it back down.
  memory = "1024mb"
